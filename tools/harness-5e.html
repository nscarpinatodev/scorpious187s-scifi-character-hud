<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sci-Fi HUD harness — D&D 5e</title>
<link rel="stylesheet" href="../styles/hud-core.css">
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="../styles/dnd5e-overrides.css">
<style>
	/*
	 * A stand-in for the 5e character sheet's real structure, as the system builds it in
	 * `_onFirstRender`: .sheet-body wraps .main-content, which holds .sidebar and .tab-body.
	 */
	body { margin: 0; background: #202024; font-family: system-ui, sans-serif; color: #ddd; }
	.app { position: relative; width: var(--w, 1040px); height: 800px; margin: 16px auto; border: 1px solid #555; }
	.window-content { position: absolute; inset: 0; }
	.sheet-header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
	.sheet-header .name { font-size: 20px; }
	.ability-scores { display: flex; gap: 8px; justify-content: center; padding: 4px; }
	.ability-score { width: 72px; text-align: center; border: 1px solid #555; border-radius: 4px; padding: 4px; }
	.main-content { display: flex; gap: 8px; height: 100%; min-height: 0; }
	.sidebar { width: 210px; flex: none; display: flex; flex-direction: column; gap: 6px; padding: 6px; }
	.card { border: 1px solid #555; border-radius: 4px; padding: 6px; }
	.tab-body { flex: 1; min-width: 0; overflow: auto; padding: 6px; }
	.tab { display: none; } .tab.active { display: block; }
	nav.tabs { display: flex; gap: 6px; }
	nav.tabs a { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid #666; border-radius: 4px; }
	.item-row { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgb(255 255 255 / 10%); }
</style>
</head>
<body>
<div class="app dnd5e2 sheet actor character sfh-app sfh-v2" id="app">
	<div class="window-content" id="content">
		<div data-application-part="header" class="sheet-header">
			<span class="name">Vex Kaori</span><span>Human · Rogue 5</span>
		</div>
		<div class="sheet-body">
			<div class="main-content" data-container-id="main">
				<div data-application-part="sidebar" class="sidebar">
					<div class="card">AC 16</div>
					<div class="card">HP 31 / 38</div>
					<div class="card">Hit Dice 4/5d8</div>
					<div class="card">Death Saves ○○○ / ○○○</div>
					<div class="card">Favorites</div>
				</div>
				<div class="tab-body" data-container-id="tabs">
					<div class="tab active" data-application-part="details" data-tab="details">
						<h3>Skills</h3>
						<div class="item-row" data-item-id="i1"><strong>Laser Pistol</strong><span>+7</span><span>3d6+4 radiant</span></div>
						<div class="item-row" data-item-id="i2"><strong>Mono-Rapier</strong><span>+7</span><span>1d8+4 piercing</span></div>
						<div class="item-row" data-item-id="i3"><strong>Sneak Attack</strong><span>3d6</span></div>
					</div>
				</div>
			</div>
		</div>
		<div data-application-part="abilityScores" class="ability-scores">
			<div class="ability-score">STR 8</div><div class="ability-score">DEX 18</div><div class="ability-score">CON 14</div>
			<div class="ability-score">INT 14</div><div class="ability-score">WIS 12</div><div class="ability-score">CHA 12</div>
		</div>
		<nav data-application-part="tabs" class="tabs tabs-right">
			<a data-tab="details">D</a><a data-tab="inventory">I</a><a data-tab="features">F</a>
			<a data-tab="spells">S</a><a data-tab="effects">E</a><a data-tab="biography">B</a>
		</nav>
		<div data-application-part="warnings" class="warnings"></div>
	</div>
</div>
<script type="module" src="./harness-5e.mjs"></script>
</body>
</html>
