<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sci-Fi HUD harness</title>
<link rel="stylesheet" href="../styles/hud-core.css">
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="../styles/pf2e-overrides.css">
<style>
	/* Stand-ins for Foundry's own application chrome and a rough PF2e sheet. */
	body { margin: 0; background: #202024; font-family: system-ui, sans-serif; }
	.app { position: relative; width: var(--w, 1160px); height: 780px; margin: 16px auto; border: 1px solid #555; }
	.window-content { position: absolute; inset: 0; }
	form.sheet { margin: 0; }
	.char-header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
	.char-name input { font-size: 20px; background: transparent; border: 0; color: inherit; width: 220px; }
	.sidebar { display: flex; flex-direction: column; gap: 10px; }
	.hitpoints .hp-big { font-size: 26px; }
	.sheet-navigation { display: flex; gap: 6px; }
	.sheet-navigation a.item { text-decoration: none; }
	.sheet-content .tab { display: none; padding: 10px; }
	.sheet-content .tab.active { display: block; }
	.row { display: flex; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid rgb(255 255 255 / 10%); }
</style>
</head>
<body>
<div class="app sfh-app sfh-sheet" id="app">
	<div class="window-content">
		<form class="sheet actor character crb-style" id="form">
			<aside>
				<div class="logo"></div>
				<div class="sidebar" data-tab="sidebar">
					<header><h2>Hit Points</h2></header>
					<div class="hitpoints"><div class="hp-big">71 / 84</div></div>
					<div class="ac"><h2>AC</h2><div class="value">25</div></div>
					<div class="saves"><div class="row">Fortitude +13</div><div class="row">Reflex +10</div><div class="row">Will +11</div></div>
					<div class="perception"><div class="row">Perception +11</div></div>
					<div class="speed"><div class="row">Speed 25 ft</div></div>
				</div>
			</aside>
			<header class="char-header">
				<h1 class="char-name"><input name="name" type="text" value="Asha Rourke"></h1>
				<span>Human · Vanguard 6</span>
			</header>
			<nav class="sheet-navigation" data-group="primary" role="tablist">
				<span class="panel-title">Character</span>
				<a class="item" data-tab="character"><i class="fa-solid fa-address-card">C</i></a>
				<a class="item active" data-tab="actions"><span class="action-glyph">1</span></a>
				<a class="item" data-tab="inventory"><i>I</i></a>
				<a class="item" data-tab="spellcasting"><i>S</i></a>
				<a class="item" data-tab="crafting"><i>R</i></a>
				<a class="item" data-tab="proficiencies"><i>P</i></a>
				<a class="item" data-tab="feats"><i>F</i></a>
				<a class="item" data-tab="effects"><i>E</i></a>
				<a class="item" data-tab="biography"><i>B</i></a>
			</nav>
			<section class="sheet-body">
				<section class="sheet-content">
					<div class="tab actions active" data-group="primary" data-tab="actions">
						<h3>Strikes</h3>
						<div class="row" data-item-id="w1"><strong>M-23 Eviscerator</strong><span>+11 / +6 / +1</span><span>3d8+6 piercing</span></div>
						<div class="row" data-item-id="w2"><strong>M-11 Suppressor</strong><span>+11 / +6 / +1</span><span>2d6+2 piercing</span></div>
						<h3>Actions</h3>
						<div class="row" data-item-id="a1"><strong>Biotic Charge</strong><span>◆◆</span></div>
						<div class="row" data-item-id="a2"><strong>Nova</strong><span>◆</span></div>
						<div class="row" data-item-id="a3"><strong>Shockwave</strong><span>◆◆</span></div>
					</div>
				</section>
			</section>
		</form>
	</div>
</div>
<script type="module" src="./harness.mjs"></script>
</body>
</html>
