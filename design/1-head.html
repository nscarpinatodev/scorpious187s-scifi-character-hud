<title>Sci-Fi Character HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Audiowide&family=Michroma&family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;500;600;700&family=VT323&family=Oxanium:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--page:#0b0d10;--page-2:#14181d;--page-line:#262d36;--page-text:#d9dee5;--page-dim:#8d98a5;--page-acc:#e8a15a;color-scheme:dark}
html,body{background:var(--page);color:var(--page-text)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;padding-inline:16px;padding-block:14px 28px}
.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto 12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand strong{font-size:17px;letter-spacing:.02em;color:#f2f4f7}
.brand span{font-size:12.5px;color:var(--page-dim);text-wrap:balance}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl label{font-size:12px;color:var(--page-dim)}
.ctl select,.ctl button{height:32px;border:1px solid var(--page-line);background:var(--page-2);color:var(--page-text);border-radius:6px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
.ctl button[aria-pressed="true"]{border-color:var(--page-acc);color:#fff;background:#3a2a17}
.ctl button:disabled{opacity:.45;cursor:not-allowed}
.ctl :focus-visible{outline:2px solid var(--page-acc);outline-offset:2px}
#wrap{position:relative;max-width:1280px;margin:0 auto;overflow:hidden;border:1px solid var(--page-line);border-radius:8px}
#scaler{position:absolute;left:0;top:0;width:1280px;height:860px;transform-origin:0 0}
.foot{max-width:1280px;margin:10px auto 0;font-size:12.5px;color:var(--page-dim);line-height:1.5}
.foot b{color:var(--page-text);font-weight:600}

/* ---------- theme tokens ---------- */
.stage{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs)}
.t-omni{--scan:rgba(255,255,255,.045);--bg:radial-gradient(ellipse at 50% 36%,#111723 0%,#05070b 68%);--pnl:rgba(51,51,51,.82);--pnl2:rgba(26,26,26,.55);--line:rgba(255,140,42,.55);--line2:rgba(255,140,42,.18);--text:#ffdcb8;--bright:#fff0de;--dim:#e0985a;--hot:#ff9a3c;--hotbg:rgba(255,140,42,.28);--hover:rgba(255,140,42,.16);--glow:rgba(255,140,42,.7);--acc:#5ec8ff;--accbg:rgba(94,200,255,.16);--bad:#ff5a4a;--good:#8dffb0;--font:Rajdhani,'Arial Narrow',sans-serif;--display:Michroma,Rajdhani,'Arial Narrow',sans-serif;--mono:'Share Tech Mono',ui-monospace,monospace;--fs:15px;--r:0px;--clip:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));--pshadow:inset 0 0 22px rgba(255,120,20,.15),0 0 14px rgba(255,120,20,.1)}
.t-wrist{--scan:rgba(255,255,255,.05);--bg:#0b0418;--pnl:rgba(22,9,48,.86);--pnl2:rgba(255,255,255,.04);--line:rgba(53,236,242,.55);--line2:rgba(199,155,255,.18);--text:#eadcff;--bright:#ffffff;--dim:#c79bff;--hot:#ff4fb4;--hotbg:rgba(255,79,180,.26);--hover:rgba(53,236,242,.14);--glow:rgba(255,79,180,.7);--acc:#35ecf2;--accbg:rgba(53,236,242,.14);--bad:#ff6b6b;--good:#7dffc8;--font:'Chakra Petch',sans-serif;--display:Audiowide,'Chakra Petch',sans-serif;--mono:VT323,ui-monospace,monospace;--fs:14px;--r:10px;--clip:none;--pshadow:0 0 18px rgba(53,236,242,.18),inset 0 0 16px rgba(255,79,180,.1)}
.t-gdi{--scan:rgba(255,255,255,.055);--bg:#060805;--pnl:#0c1209;--pnl2:rgba(0,0,0,.35);--line:rgba(118,214,96,.45);--line2:rgba(118,214,96,.16);--text:#d6f2c9;--bright:#effde8;--dim:#8fbf7c;--hot:#6dff5a;--hotbg:rgba(109,255,90,.2);--hover:rgba(109,255,90,.12);--glow:rgba(109,255,90,.6);--acc:#f2c230;--accbg:rgba(242,194,48,.16);--bad:#ff4a3a;--good:#6dff5a;--font:Oxanium,sans-serif;--display:Oxanium,sans-serif;--mono:'Share Tech Mono',ui-monospace,monospace;--fs:14px;--r:0px;--clip:none;--pshadow:inset 0 0 0 1px #000,inset 0 0 24px rgba(0,0,0,.6)}
.t-tron{--scan:rgba(111,233,255,.045);--bg:#01060a;--pnl:rgba(2,10,16,.88);--pnl2:rgba(111,233,255,.045);--line:rgba(111,233,255,.75);--line2:rgba(111,233,255,.22);--text:#c9f6ff;--bright:#f0feff;--dim:#74c8dc;--hot:#6fe9ff;--hotbg:rgba(111,233,255,.2);--hover:rgba(111,233,255,.14);--glow:rgba(111,233,255,.75);--acc:#ff9d2e;--accbg:rgba(255,157,46,.16);--bad:#ff6a2a;--good:#9dffe0;--font:Oxanium,sans-serif;--display:Orbitron,Oxanium,sans-serif;--mono:'Share Tech Mono',ui-monospace,monospace;--fs:14px;--r:3px;--clip:none;--pshadow:0 0 12px rgba(111,233,255,.28),inset 0 0 18px rgba(111,233,255,.07)}
.t-nod{--scan:rgba(255,255,255,.055);--bg:#080404;--pnl:#140707;--pnl2:rgba(0,0,0,.35);--line:rgba(255,60,50,.45);--line2:rgba(255,60,50,.16);--text:#f5d9d4;--bright:#fff3f0;--dim:#c9847c;--hot:#ff3b30;--hotbg:rgba(255,59,48,.22);--hover:rgba(255,59,48,.13);--glow:rgba(255,59,48,.65);--acc:#efe6d2;--accbg:rgba(239,230,210,.14);--bad:#ffd060;--good:#efe6d2;--font:Oxanium,sans-serif;--display:Oxanium,sans-serif;--mono:'Share Tech Mono',ui-monospace,monospace;--fs:14px;--r:0px;--clip:none;--pshadow:inset 0 0 0 1px #000,inset 0 0 24px rgba(0,0,0,.6)}

/* ---------- slots ---------- */
.slot{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.slot>*{min-height:0;max-width:100%}
.pnl{background:var(--pnl);border:1px solid var(--line);box-shadow:var(--pshadow);clip-path:var(--clip);border-radius:var(--r)}
/* The scan. A screen with a housing is scanned whole; panels floating in the air are
   scanned one by one. No position on .pnl: .slot is already absolute, and relative would
   override it. */
.pnl::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,var(--scan) 0 var(--scanline,1px),transparent var(--scanline,1px) var(--scanpitch,3px))}
.t-wrist .pnl::after,.t-gdi .pnl::after,.t-nod .pnl::after{content:none}
.pad{padding:12px 14px;gap:10px}
.slot.pad,.slot-in{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.lbl{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);color:var(--bright);text-shadow:0 0 10px var(--glow);line-height:1}
.hot{color:var(--hot)}.acc{color:var(--acc)}.brt{color:var(--bright)}.dimc{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.grow{flex:1 1 auto;min-width:0}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;min-height:0}
.sep{border-top:1px solid var(--line2);padding-top:10px}
.b{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:calc(var(--r)*.6);cursor:pointer;min-height:30px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b:hover{background:var(--hover)}
.b:focus-visible,.slot [tabindex]:focus-visible{outline:2px solid var(--bright);outline-offset:1px}
.b.on{background:var(--hotbg);border-color:var(--hot);color:var(--bright)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.sm{min-height:24px;padding:0 7px;font-size:12px}
.b.ic{width:30px;padding:0}
.roll{font-family:var(--mono);font-size:1.05em;color:var(--bright);background:var(--hotbg);min-width:46px}
.ghost{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hot)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:20px;padding:0 7px;border:1px solid var(--line);border-radius:calc(var(--r)*.5);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--hot);white-space:nowrap}
.chip.me{border-color:var(--acc);color:var(--acc)}
.chip button{font:inherit;color:inherit;background:none;border:0;padding:0 1px;cursor:pointer;min-height:18px}
.barx{height:8px;background:var(--line2);border-radius:calc(var(--r)*.3);overflow:hidden}
.barx>i{display:block;height:100%;background:var(--hot);box-shadow:0 0 10px var(--glow)}
.barx.a>i{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.cells{--cw:86px;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));grid-auto-rows:minmax(min-content,auto);gap:6px}
.t-omni .cells,.t-tron .cells{--cw:74px}
.t-wrist .cells{gap:4px}.t-wrist .cell{min-height:38px}.t-wrist .cell .v{font-size:17px}
.big{white-space:nowrap}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;padding:4px;border:1px solid var(--line2);background:var(--pnl2);border-radius:calc(var(--r)*.6);font:inherit;color:inherit}
/* Foundry gives every button a fixed height; a cell is as tall as its row */
button.cell{cursor:pointer;border-color:var(--line);height:auto}button.cell:hover{background:var(--hover)}
.cell{overflow:hidden}
.cell .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;line-height:1.1;letter-spacing:.08em}
.cell .v{font-family:var(--mono);font-size:20px;color:var(--bright);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.wide{grid-column:1/-1}
.pips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:100%;padding:3px}
.t-wrist .pips{gap:5px}
.pip{flex:none;width:15px;height:15px;min-height:0;border:1px solid var(--hot);background:transparent;cursor:pointer;padding:0;transform:rotate(45deg);border-radius:calc(var(--r)*.2)}
.pip.on{background:var(--hot);box-shadow:0 0 8px var(--glow)}
.pip.bad{border-color:var(--bad)}.pip.bad.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.t-wrist .pip,.t-wrist .dot{transform:none;border-radius:50%;width:17px;height:17px}
/* segmented tracks — hero points, dying: one segment per point, slanted on the omni-tool, pills on the wrist, blocks on the EVA */
.trk{gap:6px}
.trk-h{display:flex;align-items:center;justify-content:center;gap:4px;max-width:100%}
.b.trk-roll{min-height:0;height:15px;padding:0 4px;font-size:9.5px;line-height:1;border-color:var(--bad);color:var(--bright)}
.segs{display:flex;justify-content:center;gap:4px;width:100%;padding:0 5px;box-sizing:border-box}
.seg{flex:0 1 18px;min-width:8px;height:13px;min-height:0;padding:0;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;transform:skewX(-20deg)}
.seg:hover{background:var(--hover);border-color:var(--hot)}
.seg.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 8px var(--glow)}
.seg.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.seg.bad:hover{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.seg.bad.on{background:var(--bad);border-color:var(--bad);box-shadow:0 0 8px var(--bad)}
.seg.lock{cursor:default;border-style:dashed;border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--bad) 35%,transparent) 0 2px,transparent 2px 5px)}
.segsep{flex:none;width:1px;align-self:stretch;margin:0 3px;background:var(--line)}
.t-wrist .seg{transform:none;border-radius:7px}
.t-gdi .seg,.t-nod .seg{transform:none;height:11px;box-shadow:inset 0 0 0 1px #000}
.t-tron .seg{transform:none;height:9px;border-radius:1px}
/* Oxanium runs wider than the Rajdhani these panels were sized for */
.t-tron .cell{padding:4px 2px}.t-tron .cell .lbl{font-size:10px;letter-spacing:.02em}
.t-tron .sfh-hp{padding:7px 8px}.t-tron .sfh-hp .lbl{letter-spacing:.04em}
.t-tron .sfh-hp .hp-a .b{padding:0 3px;font-size:10.5px;letter-spacing:.03em}
.t-tron .chip{letter-spacing:.03em}
.trk.alert{border-color:var(--bad);animation:alert 1.6s ease-in-out infinite}
.trk.alert .lbl{color:var(--bad)}
@keyframes alert{50%{box-shadow:inset 0 0 16px color-mix(in srgb,var(--bad) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.trk.alert{animation:none;box-shadow:inset 0 0 12px color-mix(in srgb,var(--bad) 35%,transparent)}}
.cell .v.warn{color:var(--hot);text-shadow:0 0 8px var(--glow)}
.cell .v.bad{color:var(--bad);text-shadow:0 0 8px var(--bad)}

/* ---------- projection ---------- */
.proj{padding:0}
.proj-h{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.proj-t{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bright);margin-right:10px}
.src{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim);opacity:.8}
.proj-b{padding:12px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto}
/* the body scrolls: a row keeps its height rather than shrinking and spilling onto the next */
.proj-b>*,.sfh-results>*{flex:none}
.sec{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;margin-top:4px}
.sec::after{content:'';flex:1;border-top:1px solid var(--line2)}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:38px;padding:4px 10px;border:1px solid var(--line2);background:var(--pnl2);border-radius:calc(var(--r)*.6)}
.li.flat{border-width:0 0 1px;background:none;border-radius:0}
.li>.grow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow:hidden}
.li>.chip,.li>.b,.li>.cost,.li>.rk,.li>.pips,.li>.row,.li>.mono{flex:none}
.li .nm{font-weight:700;color:var(--bright);font-size:1.05em;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;text-align:left;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.15}
.li .nm:hover{color:var(--hot)}
.li .sub{font-size:12px;color:var(--dim);letter-spacing:.04em}
.cost{font-family:var(--mono);color:var(--hot);min-width:28px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.kv{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid var(--line2);background:var(--pnl2);border-radius:calc(var(--r)*.6)}
.kv b{font-weight:600;color:var(--bright)}
.rk{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--line2);color:var(--dim);flex:none}
.rk.T{border-color:var(--line);color:var(--text);background:var(--pnl2)}
/* a skill's training, changed where it is shown: the letter stays, the arrow goes */
.rk-sel{appearance:none;-webkit-appearance:none;box-sizing:border-box;width:24px;height:22px;min-height:0;padding:0;margin:0;background:transparent;font:inherit;font-size:12px;font-weight:700;line-height:1;text-align:center;text-align-last:center;cursor:pointer;border-radius:calc(var(--r)*.4)}
.rk-sel:hover,.rk-sel:focus{border-color:var(--hot);box-shadow:0 0 8px var(--glow);outline:none}
.rk-sel:disabled{cursor:default;box-shadow:none}
.rk-sel option{background:#0a0b0e;color:#eee}
.sfh-browse{gap:6px}
.sfh-browse .sfh-in{height:28px;min-height:0;text-align:left;font-family:var(--font)}
/* the quick search's results, under its box: they scroll rather than push the inventory away */
.sfh-results{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto;flex:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sfh-results:empty{display:none}
.sfh-results p{margin:4px 2px}
.li.qs{gap:8px}
.li.qs img{width:24px;height:24px;flex:none;object-fit:contain;border:0}
.li>.qs-price{flex:none;min-width:48px;text-align:right}
.qs-more{font-size:12px}
/* a strike's ammunition and the sheet's other weapon buttons */
.sfh-ammo{gap:6px;flex-wrap:wrap;width:100%}
.sfh-ammo .sel,.sel.sfh-aux{height:24px;min-height:0;padding:0 4px;font-size:11.5px;max-width:190px}
.sfh-ammo .sel option,.sel.sfh-aux option{background:#0a0b0e;color:#eee}
.sfh-shield .sfh-in{width:3.2em;height:24px;min-height:0;flex:none}
/* how an item is carried, and its gem: fixed widths, so the columns line up down the tab */
.li>.carry,.li>.give,.li>.invest,.li>.invest-gap{flex:none}
.sel.give{width:72px;height:24px;min-height:0;padding:0 4px;font-size:11.5px;color:var(--dim)}
.sel.give option{background:#0a0b0e;color:#eee}
.sel.give:disabled{opacity:.45;cursor:default}
.sel.carry{width:112px;height:24px;min-height:0;padding:0 4px;font-size:11.5px}
.sel.carry.on{border-color:var(--hot);color:var(--bright);background:var(--hotbg)}
.sel.carry option{background:#0a0b0e;color:#eee}
.b.invest,.invest-gap{width:26px;padding:0}
.b.invest{color:var(--dim)}
.b.invest.on{color:var(--bright);border-color:var(--hot);background:var(--hotbg);box-shadow:0 0 8px var(--glow)}
/* a spent spell fades, but the button that restores it should not */
.li.spent>:not(.b){opacity:.55}
.rk.E,.rk.M,.rk.L{border-color:var(--hot);color:var(--bright);background:var(--hotbg)}
.empty{padding:28px 16px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:calc(var(--r)*.6)}
.ta{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;font:inherit;color:var(--text);background:var(--pnl2);border:1px solid var(--line2);border-radius:calc(var(--r)*.6);padding:8px 10px}
.ta:focus{outline:1px solid var(--hot)}
/* typed values: hit points, amounts, and the right-click editor */
.sfh-in{font:inherit;font-family:var(--mono);color:var(--bright);background:var(--pnl2);border:1px solid var(--line2);border-radius:calc(var(--r)*.4);min-width:0;width:100%;box-sizing:border-box;padding:2px 6px;text-align:center}
.sfh-in:focus{outline:1px solid var(--hot);border-color:var(--hot);background:rgba(0,0,0,.55)}
.sfh-in::-webkit-outer-spin-button,.sfh-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sfh-in[type=number]{-moz-appearance:textfield}
.sfh-in-hp{width:3.2em;height:auto;min-height:0;font-size:26px;line-height:1;padding:0 2px;text-align:right;background:transparent;border-color:transparent;color:var(--bright);text-shadow:0 0 10px var(--glow)}
.sfh-in-hp:hover{border-color:var(--line2)}
.sfh-temp{display:flex;align-items:center;gap:5px;flex:none}
.sfh-hp{align-items:stretch;gap:5px;padding:7px 10px}
.sfh-hp .lbl{overflow:visible;text-overflow:clip;letter-spacing:.1em}
.sfh-hp .sfh-in:not(.sfh-in-hp){height:24px;min-height:0}
.sfh-hp .hp-a .b{height:24px;min-height:24px}
.sfh-hp .hp-b{align-self:center;width:100%}
/* where the panel is wide or short, the number shares its row: with the buttons on the wrist, with the bar on the EVA */
.t-wrist .sfh-hp{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h h" "v a" "b b";column-gap:14px}
.t-gdi .sfh-hp,.t-nod .sfh-hp{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h h" "v b" "a a";column-gap:12px}
.sfh-hp .hp-h{grid-area:h}.sfh-hp .hp-v{grid-area:v}.sfh-hp .hp-b{grid-area:b}.sfh-hp .hp-a{grid-area:a}
.sfh-temp .sfh-in{width:3.4em}
.sfh-menu{position:absolute;left:8px;right:8px;top:8px;z-index:12;display:flex;flex-direction:column;gap:6px;padding:10px;background:linear-gradient(var(--pnl),var(--pnl)),#0a0b0e;border:1px solid var(--hot);border-radius:calc(var(--r)*.6);box-shadow:0 0 22px var(--glow)}
.sfh-menu label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim)}
.sfh-menu .sfh-in{width:5em;flex:none}
